# Claude mode (AxiFlow): Claude Code writes a pitch script, brochure or proposal for a CRM lead.
# AxiFlow (src/claude-worker.js) sends a repository_dispatch "axiflow-generate" with the job (prompt, schema,
# lead data) in client_payload. Nothing is committed; the lead data only lives in this run's workspace.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, Claude subscription), AXIFLOW_CALLBACK_SECRET.
# Keep this repo private: run logs of a public repo are public.
name: Claude generate (AxiFlow)

on:
  repository_dispatch:
    types: [axiflow-generate]

permissions:
  contents: read

concurrency:
  group: claude-doc-${{ github.event.client_payload.doc_id }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Speed: keep the Claude Code package between runs (refreshed weekly).
      - id: week
        run: echo "n=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: claude-code-npm-${{ steps.week.outputs.n }}
      - name: Install Claude Code
        run: npm install -g --prefer-offline --no-audit --no-fund @anthropic-ai/claude-code@latest

      - name: Write the job (not printed)
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          mkdir -p claude-worker/work/out
          printf '%s' "$PAYLOAD" > claude-worker/work/payload.json
          node claude-worker/prepare.mjs

      - name: Claude Code writes the document
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          WEB="$(node -p "require('./claude-worker/work/job.json').web ? 1 : 0")"
          if [ -f claude-worker/work/PROMPT-inline.txt ]; then
            # SWOT: the job is in the prompt and the JSON is the final message (no file tools, few turns)
            PROMPT_FILE=claude-worker/work/PROMPT-inline.txt; TURNS=8; TOOLS="WebSearch,WebFetch"
            [ "$WEB" = "1" ] || TOOLS="WebFetch"; [ "$WEB" = "1" ] || TURNS=2
          else
            PROMPT_FILE=claude-worker/PROMPT.txt; TURNS=60
            TOOLS="Read,Write,Edit,Bash(node claude-worker/validate.mjs),Bash(node claude-worker/validate.mjs:*)"
            [ "$WEB" = "1" ] && TOOLS="$TOOLS,WebSearch,WebFetch"
          fi
          claude -p "$(cat "$PROMPT_FILE")" \
            --allowedTools "$TOOLS" --max-turns "$TURNS" --output-format json > claude-worker/work/claude.json \
            || { node -e "try{const j=require('./claude-worker/work/claude.json');const m=String(j.is_error?j.result:j.subtype||'').slice(0,300);console.log('Claude Code failed:', m);require('fs').writeFileSync('claude-worker/work/claude-error.txt', m)}catch(e){console.log('Claude Code failed before answering')}"; exit 1; }
          # inline jobs: the final message is the answer
          [ -f claude-worker/work/PROMPT-inline.txt ] && node claude-worker/inline-result.mjs
          # usage only (numbers, no lead data): turns, tokens, cost, time, per model
          node -e "const j=require('./claude-worker/work/claude.json');const u=j.usage||{};console.log('USAGE', JSON.stringify({kind:require('./claude-worker/work/job.json').kind,turns:j.num_turns,cost_usd:j.total_cost_usd,ms:j.duration_ms,input:u.input_tokens,cache_write:u.cache_creation_input_tokens,cache_read:u.cache_read_input_tokens,output:u.output_tokens,web_search:u.server_tool_use&&u.server_tool_use.web_search_requests,models:Object.fromEntries(Object.entries(j.modelUsage||{}).map(([k,v])=>[k,{in:v.inputTokens,out:v.outputTokens,cache_read:v.cacheReadInputTokens,cache_write:v.cacheCreationInputTokens,usd:v.costUSD}]))}))" || true

      - name: Send the result back to AxiFlow
        if: always()
        env:
          AXIFLOW_CALLBACK_SECRET: ${{ secrets.AXIFLOW_CALLBACK_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node claude-worker/post.mjs
